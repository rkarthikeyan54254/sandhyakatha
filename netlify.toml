[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# A story that fails validation must never reach a parent, so the deploy
# fails with it — `npm run build` runs validate:strict first.

# Functions declare their own /api/* paths; this catch-all must stay last so it
# only ever sees what nothing else claimed.
[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    # No Google script is ever loaded in the page — the OAuth exchange happens
    # in a function — so script-src stays 'self' and form-action allows only
    # the sign-in redirect we start ourselves.
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://accounts.google.com"

# Story bodies are immutable per version — cache them hard.
[[headers]]
  for = "/data/s/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Shareable story pages are static and change only when the story does.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/s/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

[[headers]]
  for = "/data/index.json"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

name: promote-first-five

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  promote:
    if: github.head_ref == 'corpus-expansion-10-trilingual-20261002'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Promote approved first five into canonical review corpus
        run: node studio/batches/2026-10-02-ten-stories/checkpoint-5/promote-first5.mjs
      - run: npm ci
      - name: Reassemble reviewed ChatGPT hero art
        run: |
          ids=(amarniti-scales sundarar-court appar-spade thirumangai-ring kulasekhara-march)
          for id in "${ids[@]}"; do
            mkdir -p "public/media/stories/$id"
            cat ".media-staging/$id"/*.part > "public/media/stories/$id/hero.webp"
          done
      - name: Verify hero image parity
        run: |
          ids=(amarniti-scales sundarar-court appar-spade thirumangai-ring kulasekhara-march)
          for id in "${ids[@]}"; do
            file="public/media/stories/$id/hero.webp"
            read width height < <(identify -format '%w %h' "$file")
            bytes=$(wc -c < "$file")
            echo "$id — ${width}x${height}, ${bytes} bytes"
            test "$width" -ge 1200
            test "$height" -ge 800
            test "$bytes" -ge 120000
          done
      - name: Generate dedicated social cards from reviewed hero art
        run: npm run og
      - name: Refresh locks without weakening publication gates
        run: |
          npm run lock
          npm run lock:locales
      - name: Validate strict corpus
        run: npm run validate:strict
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Verify native-language gate
        run: npm run verify:native-language
      - name: Verify locale parity
        run: npm run verify:locale-parity
      - name: Verify read-aloud gate
        run: npm run verify:read-aloud
      - name: Verify design parity
        run: npm run verify:design-parity
      - name: Verify static surfaces
        run: npm run verify:surfaces
      - name: Verify cache policy
        run: npm run verify:cache
      - name: Remove one-shot promotion machinery
        run: |
          rm -rf .media-staging
          rm .github/workflows/promote-first5.yml
          rm studio/batches/2026-10-02-ten-stories/checkpoint-5/promote-first5.mjs
      - name: Commit validated promotion back to branch
        run: |
          git config user.name 'Rama Karthikeyan'
          git config user.email 'rkarthikeyan54254@gmail.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No promotion diff to commit.'
          else
            git commit -m 'Promote approved first five trilingual stories'
            git push origin HEAD:${{ github.head_ref }}
          fi

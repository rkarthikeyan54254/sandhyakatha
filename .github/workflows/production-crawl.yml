name: production-crawl

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"
  workflow_run:
    workflows: ["content"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  verify-production-crawl:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify matching production deploy as PerplexityBot
        if: github.event_name == 'workflow_run'
        env:
          EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          for attempt in {1..24}; do
            set +e
            node scripts/verify-production-crawl.mjs
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then exit 0; fi
            if [ "$code" -ne 75 ]; then exit "$code"; fi
            sleep 10
          done
          echo "Production did not expose the expected deploy marker."
          exit 1
      - name: Verify production as PerplexityBot
        if: github.event_name != 'workflow_run'
        run: node scripts/verify-production-crawl.mjs

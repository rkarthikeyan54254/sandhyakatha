name: apply-syamantaka-release

on:
  push:
    branches: [syamantaka-mani-trilingual-curation]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: syamantaka-mani-trilingual-curation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply Syamantaka release metadata
        run: |
          node <<'NODE'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';

          const read = p => JSON.parse(fs.readFileSync(p, 'utf8'));
          const write = (p, v) => fs.writeFileSync(p, JSON.stringify(v, null, 2) + '\n');

          const storyPath = 'content/stories/syamantaka-mani.json';
          const storyText = fs.readFileSync(storyPath, 'utf8');
          const story = JSON.parse(storyText);
          const sourceBlobSha1 = createHash('sha1')
            .update(`blob ${Buffer.byteLength(storyText)}\0`)
            .update(storyText)
            .digest('hex');
          const contentHash = createHash('sha256')
            .update(JSON.stringify(story.lengths) + JSON.stringify(story.close))
            .digest('hex')
            .slice(0, 16);

          for (const localePath of [
            'content/locales/hi/syamantaka-mani.json',
            'content/locales/ta/syamantaka-mani.json'
          ]) {
            const locale = read(localePath);
            locale.sourceVersion = story.version;
            locale.sourceBlobSha1 = sourceBlobSha1;
            write(localePath, locale);
          }

          const canonPath = 'content/canon.json';
          const canon = read(canonPath);
          const canonRow = {
            n: 95,
            id: 'syamantaka-mani',
            title: 'The Jewel Kṛṣṇa Was Blamed For',
            corpus: 'bhagavata',
            tradition: 'sanskrit',
            work: 'Bhāgavata Purāṇa',
            locus: 'Skandha 10, chapter 56; parallel Viṣṇu Purāṇa IV.13',
            stability: 'variant',
            minAge: 7,
            sensitivity: ['death', 'violence', 'injustice'],
            value: 'looking at it before fixing it',
            hook: 'A hunter vanishes wearing a jewel bright as the Sun. Before anyone follows the tracks, Dvārakā has already decided who took it.',
            festivals: ['ganesh-chaturthi'],
            status: 'published',
            wave: 5,
            gated: false,
            careNote: 'Prasena and his horse are killed by a lion; Jāmbavān kills the lion; Kṛṣṇa and Jāmbavān fight for many days. The deaths and fight are stated plainly and not described graphically.'
          };
          const canonIndex = canon.canon.findIndex(row => row.id === canonRow.id);
          if (canonIndex >= 0) canon.canon[canonIndex] = canonRow;
          else canon.canon.push(canonRow);
          canon.canon.sort((a, b) => (a.n ?? 0) - (b.n ?? 0));
          write(canonPath, canon);

          const lexiconPath = 'content/lexicon.json';
          const lexicon = read(lexiconPath);
          Object.assign(lexicon, {
            'Syamantaka': {
              id: 'syamantaka-mani',
              native: { deva: 'स्यमन्तक मणि', taml: 'ஸ்யமந்தக மணி' },
              say: 'syuh-MUN-tuh-kuh MUH-nee',
              kind: 'word',
              gloss: 'The radiant jewel at the centre of this story, associated with Sūrya and with extraordinary prosperity when kept properly.',
              aliases: ['Syamantaka Mani', 'Syamantaka Maṇi']
            },
            'Satrājit': {
              id: 'satrajit',
              native: { deva: 'सत्राजित्', taml: 'சத்ராஜித்' },
              say: 'sut-RAA-jit',
              kind: 'person',
              gloss: 'A Yādava devotee of Sūrya who receives the Syamantaka jewel and chooses to keep it.',
              aliases: ['Satrajit']
            },
            'Prasena': {
              id: 'prasena',
              native: { deva: 'प्रसेन', taml: 'பிரசேனன்' },
              say: 'pruh-SAY-nuh',
              kind: 'person',
              gloss: "Satrājit's brother, killed by a lion while hunting with the Syamantaka jewel.",
              aliases: ['Prasen']
            },
            'Dvārakā': {
              id: 'dvaraka',
              native: { deva: 'द्वारका', taml: 'துவாரகை' },
              say: 'DWAAR-uh-kaa',
              kind: 'place',
              gloss: "Kṛṣṇa's city, where the accusation about Prasena and the Syamantaka jewel spreads.",
              aliases: ['Dvaraka', 'Dwarka', 'Dwaraka']
            },
            'Ugrasena': {
              id: 'ugrasena',
              native: { deva: 'उग्रसेन', taml: 'உக்ரசேனன்' },
              say: 'oog-ruh-SAY-nuh',
              kind: 'person',
              gloss: 'King of the Yādavas. Kṛṣṇa says a jewel of such public value should properly be placed with him.',
              aliases: []
            },
            'Jāmbavatī': {
              id: 'jambavati',
              native: { deva: 'जाम्बवती', taml: 'ஜாம்பவதி' },
              say: 'jaam-buh-VUH-tee',
              kind: 'person',
              gloss: "Jāmbavān's daughter, whom Kṛṣṇa marries after the Syamantaka jewel is recovered.",
              aliases: ['Jambavati', 'Jambavathi']
            }
          });
          write(lexiconPath, lexicon);

          const mediaPath = 'content/media.json';
          const media = read(mediaPath);
          media.stories['syamantaka-mani'] = {
            canonStatus: 'published',
            storyVersion: 1,
            image: {
              status: 'approved',
              type: 'illustration',
              file: '/media/stories/syamantaka-mani/hero.webp',
              reviewedBy: 'rama',
              reviewedOn: '2026-10-03'
            },
            voiceover: { en: { status: 'not_started', file: null } }
          };
          write(mediaPath, media);

          const lockPath = 'content/content.lock.json';
          const lock = read(lockPath);
          lock.generated = '2026-10-03';
          lock.stories['syamantaka-mani'] = {
            version: story.version,
            status: story.status,
            hash: contentHash
          };
          write(lockPath, lock);

          const mapPath = 'content/observance-story-map.json';
          const map = read(mapPath);
          const mapping = {
            observanceId: 'ganesh-chaturthi',
            storyId: 'syamantaka-mani',
            relevance: 'direct',
            storyStateAtProposal: 'published',
            status: 'proposed',
            reason: 'Mudgala Purāṇa 4.6 and Nārada Purāṇa 113 explicitly connect the Syamantaka accusation and its remedy with accidental Caturthī moon-sighting.'
          };
          const mappingIndex = map.mappings.findIndex(x => x.observanceId === mapping.observanceId && x.storyId === mapping.storyId);
          if (mappingIndex >= 0) map.mappings[mappingIndex] = mapping;
          else map.mappings.push(mapping);
          write(mapPath, map);

          console.log({ sourceBlobSha1, contentHash });
          NODE
      - run: npm ci
      - name: Validate the release metadata
        run: npm run validate:strict
      - name: Commit release metadata and remove one-off workflow
        run: |
          rm .github/workflows/syamantaka-release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish approved Syamantaka Mani story"
          git push origin HEAD:syamantaka-mani-trilingual-curation

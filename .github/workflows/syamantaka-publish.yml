name: publish-syamantaka-mani

on:
  push:
    branches: [syamantaka-mani-trilingual-curation]

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: syamantaka-mani-trilingual-curation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Promote approved Syamantaka editions
        run: |
          node <<'NODE'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';

          const read = p => JSON.parse(fs.readFileSync(p, 'utf8'));
          const write = (p, v) => fs.writeFileSync(p, JSON.stringify(v, null, 2) + '\n');
          const reviewer = 'rama';
          const reviewedOn = '2026-10-03';
          const gate = () => ({ status: 'approved', reviewer, reviewedOn });

          const storyPath = 'content/stories/syamantaka-mani.json';
          const story = read(storyPath);
          story.status = 'published';
          story.source.reviewedBy = reviewer;
          story.source.reviewedOn = reviewedOn;
          write(storyPath, story);

          const storyText = fs.readFileSync(storyPath, 'utf8');
          const sourceBlobSha1 = createHash('sha1')
            .update(`blob ${Buffer.byteLength(storyText)}\0`)
            .update(storyText)
            .digest('hex');

          fs.mkdirSync('content/locales/hi', { recursive: true });
          fs.mkdirSync('content/locales/ta', { recursive: true });
          fs.copyFileSync('studio/review/syamantaka-mani/hi-IN.json', 'content/locales/hi/syamantaka-mani.json');
          fs.copyFileSync('studio/review/syamantaka-mani/ta-IN.json', 'content/locales/ta/syamantaka-mani.json');

          for (const localePath of [
            'content/locales/hi/syamantaka-mani.json',
            'content/locales/ta/syamantaka-mani.json'
          ]) {
            const locale = read(localePath);
            locale.sourceVersion = story.version;
            locale.sourceBlobSha1 = sourceBlobSha1;
            locale.status = 'approved';
            locale.lengths.short.measuredSeconds = 180;
            locale.lengths.full.measuredSeconds = 360;
            locale.review.nativeReadAloud.short = gate();
            locale.review.nativeReadAloud.full = gate();
            locale.review.languageEditor = gate();
            locale.review.sourceFidelity = gate();
            write(localePath, locale);
          }

          const canonPath = 'content/canon.json';
          const canon = read(canonPath);
          const canonRow = canon.canon.find(row => row.id === 'syamantaka-mani');
          if (!canonRow) throw new Error('syamantaka-mani missing from canon');
          canonRow.status = 'published';
          write(canonPath, canon);

          const mediaPath = 'content/media.json';
          const media = read(mediaPath);
          const mediaRow = media.stories?.['syamantaka-mani'];
          if (!mediaRow) throw new Error('syamantaka-mani missing from media metadata');
          mediaRow.canonStatus = 'published';
          mediaRow.storyVersion = story.version;
          mediaRow.image.status = 'approved';
          mediaRow.image.reviewedBy = reviewer;
          mediaRow.image.reviewedOn = reviewedOn;
          write(mediaPath, media);

          const mapPath = 'content/observance-story-map.json';
          const map = read(mapPath);
          const mapping = map.mappings.find(x => x.observanceId === 'ganesh-chaturthi' && x.storyId === 'syamantaka-mani');
          if (!mapping) throw new Error('Syamantaka observance mapping missing');
          mapping.storyStateAtProposal = 'published';
          write(mapPath, map);

          const publicPath = 'content/locale-public.json';
          const publicCfg = read(publicPath);
          for (const locale of ['hi-IN', 'ta-IN']) {
            if (!publicCfg.editions.some(e => e.storyId === 'syamantaka-mani' && e.locale === locale)) {
              publicCfg.editions.push({ storyId: 'syamantaka-mani', locale });
            }
          }
          write(publicPath, publicCfg);

          console.log(`Syamantaka promoted; canonical blob ${sourceBlobSha1}`);
          NODE
      - name: Regenerate locks
        run: npm run lock
      - name: Validate strict corpus
        run: npm run validate:strict
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit approved release
        run: |
          rm .github/workflows/syamantaka-publish.yml
          rm -f studio/ops/syamantaka-publish-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Syamantaka Mani in English Hindi and Tamil"
          git push origin HEAD:syamantaka-mani-trilingual-curation
